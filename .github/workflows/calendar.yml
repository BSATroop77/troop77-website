# Refresh data/calendar.json from Scoutbook and publish the site.
# A push made with GITHUB_TOKEN does not start the Pages workflow, so this
# workflow calls that deploy itself after updating the data.
name: Update Scoutbook calendar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build calendar data
        run: python3 scripts/build-calendar.py
      - name: Commit calendar data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update Scoutbook calendar data"
            git push
          fi

  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
